      if (purpleSphereWarning) drawPurpleSphereWarning(purpleSphereWarning);
      for (const warning of purpleBossSphereWarnings) drawPurpleSphereWarning(warning);

      for (const enemy of prismEnemies) {
        ctx.save();
        if (
          enemy.state === "aiming-first" ||
          enemy.state === "aiming-second" ||
          enemy.state === "aiming-final"
        ) {
          const remaining = enemy.aimTimer / PRISM_ENEMY_AIM_DURATION;
          const pulse = 1 + Math.sin(performance.now() / 90) * 0.18;
          const markerRadius = (8 + (1 - remaining) * 7) * pulse;
          ctx.strokeStyle = `rgba(255, 134, 31, ${0.2 + (1 - remaining) * 0.55})`;
          ctx.lineWidth = 2 + (1 - remaining) * 2;
          ctx.setLineDash([12, 10]);
          ctx.beginPath();
          ctx.moveTo(enemy.x, enemy.y);
          ctx.lineTo(enemy.targetX, enemy.targetY);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.globalAlpha = 0.65 + (1 - remaining) * 0.35;
          ctx.strokeStyle = "#ff9a3c";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(enemy.targetX, enemy.targetY, markerRadius, 0, Math.PI * 2);
          ctx.moveTo(enemy.targetX - markerRadius * 1.5, enemy.targetY);
          ctx.lineTo(enemy.targetX + markerRadius * 1.5, enemy.targetY);
          ctx.moveTo(enemy.targetX, enemy.targetY - markerRadius * 1.5);
          ctx.lineTo(enemy.targetX, enemy.targetY + markerRadius * 1.5);
          ctx.stroke();
        }

        ctx.lineCap = "round";
        ctx.lineWidth = 5;
        for (let pointIndex = 0; pointIndex < enemy.trail.length; pointIndex++) {
          const point = enemy.trail[pointIndex];
          const next = enemy.trail[pointIndex + 1] || enemy;
          const opacity = 1 - point.age / PRISM_ENEMY_TRAIL_LENGTH;
          ctx.strokeStyle = `rgba(255, 105, 20, ${opacity * 0.7})`;
          ctx.beginPath();
          ctx.moveTo(point.x, point.y);
          ctx.lineTo(next.x, next.y);
          ctx.stroke();
          ctx.strokeStyle = `rgba(255, 198, 111, ${opacity * 0.75})`;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.lineWidth = 5;
        }

        ctx.translate(enemy.x, enemy.y);
        ctx.rotate(Math.atan2(enemy.dy, enemy.dx) + Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, -PRISM_ENEMY_SIZE);
        ctx.lineTo(PRISM_ENEMY_SIZE * 0.65, -PRISM_ENEMY_SIZE * 0.35);
        ctx.lineTo(PRISM_ENEMY_SIZE * 0.65, PRISM_ENEMY_SIZE * 0.35);
        ctx.lineTo(0, PRISM_ENEMY_SIZE);
        ctx.lineTo(-PRISM_ENEMY_SIZE * 0.65, PRISM_ENEMY_SIZE * 0.35);
        ctx.lineTo(-PRISM_ENEMY_SIZE * 0.65, -PRISM_ENEMY_SIZE * 0.35);
        ctx.closePath();
        ctx.fillStyle = "#ff861f";
        ctx.fill();
        ctx.strokeStyle = "#ffd08a";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -PRISM_ENEMY_SIZE);
        ctx.lineTo(0, PRISM_ENEMY_SIZE);
        ctx.moveTo(-PRISM_ENEMY_SIZE * 0.65, -PRISM_ENEMY_SIZE * 0.35);
        ctx.lineTo(0, 0);
        ctx.lineTo(PRISM_ENEMY_SIZE * 0.65, -PRISM_ENEMY_SIZE * 0.35);
        ctx.moveTo(-PRISM_ENEMY_SIZE * 0.65, PRISM_ENEMY_SIZE * 0.35);
        ctx.lineTo(0, 0);
        ctx.lineTo(PRISM_ENEMY_SIZE * 0.65, PRISM_ENEMY_SIZE * 0.35);
        ctx.strokeStyle = "rgba(255, 222, 170, 0.8)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      for (const enemy of glitchEnemies) {
        const flicker = Math.sin(performance.now() / 11) * 2.5;
        const jitterX = Math.sin(performance.now() / 23) * 3;
        const jitterY = Math.cos(performance.now() / 29) * 3;
        ctx.save();
        ctx.translate(enemy.x + jitterX, enemy.y + jitterY);
        ctx.globalAlpha = 0.42;
        ctx.fillStyle = "#ff4d4d";
        ctx.fillRect(-GLITCH_ENEMY_RADIUS + flicker, -GLITCH_ENEMY_RADIUS * 0.55, GLITCH_ENEMY_RADIUS * 1.1, GLITCH_ENEMY_RADIUS * 1.1);
        ctx.fillStyle = "#35c96b";
        ctx.fillRect(-GLITCH_ENEMY_RADIUS * 1.35, -7 + flicker, GLITCH_ENEMY_RADIUS * 2.7, 14);
        ctx.fillStyle = "#4da6ff";
        ctx.beginPath();
        ctx.moveTo(0, -GLITCH_ENEMY_RADIUS * 1.35);
        ctx.lineTo(GLITCH_ENEMY_RADIUS, GLITCH_ENEMY_RADIUS * 0.8);
        ctx.lineTo(-GLITCH_ENEMY_RADIUS, GLITCH_ENEMY_RADIUS * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#a64dff";
        ctx.beginPath();
        ctx.arc(flicker, 0, GLITCH_ENEMY_RADIUS * 0.78, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = "#ff861f";
        ctx.beginPath();
        ctx.moveTo(0, -GLITCH_ENEMY_RADIUS);
        ctx.lineTo(GLITCH_ENEMY_RADIUS * 0.55, -GLITCH_ENEMY_RADIUS * 0.25);
        ctx.lineTo(GLITCH_ENEMY_RADIUS * 0.55, GLITCH_ENEMY_RADIUS * 0.25);
        ctx.lineTo(0, GLITCH_ENEMY_RADIUS);
        ctx.lineTo(-GLITCH_ENEMY_RADIUS * 0.55, GLITCH_ENEMY_RADIUS * 0.25);
        ctx.lineTo(-GLITCH_ENEMY_RADIUS * 0.55, -GLITCH_ENEMY_RADIUS * 0.25);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.strokeRect(-GLITCH_ENEMY_RADIUS, -GLITCH_ENEMY_RADIUS, GLITCH_ENEMY_RADIUS * 2, GLITCH_ENEMY_RADIUS * 2);
        ctx.restore();
        if (
          enemy.state === "aiming" ||
          enemy.state === "aiming-prism-first" ||
          enemy.state === "aiming-prism-second" ||
          enemy.state === "aiming-prism-final"
        ) {
          ctx.save();
          ctx.strokeStyle = enemy.pattern === "prism"
            ? "rgba(255, 145, 55, 0.8)"
            : "rgba(77, 166, 255, 0.75)";
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 8]);
          ctx.beginPath();
          ctx.moveTo(enemy.x, enemy.y);
          if (enemy.pattern === "triangle") {
            const trajectoryLength = Math.hypot(canvas.width, canvas.height);
            ctx.lineTo(enemy.x + enemy.dx * trajectoryLength, enemy.y + enemy.dy * trajectoryLength);
          } else {
            ctx.lineTo(enemy.targetX, enemy.targetY);
          }
          ctx.stroke();
          if (enemy.pattern === "prism") {
            const pulse = 1 + Math.sin(performance.now() / 90) * 0.18;
            const markerRadius = 9 * pulse;
            ctx.setLineDash([]);
            ctx.strokeStyle = "#ffb36b";
            ctx.beginPath();
            ctx.arc(enemy.targetX, enemy.targetY, markerRadius, 0, Math.PI * 2);
            ctx.moveTo(enemy.targetX - markerRadius * 1.5, enemy.targetY);
            ctx.lineTo(enemy.targetX + markerRadius * 1.5, enemy.targetY);
            ctx.moveTo(enemy.targetX, enemy.targetY - markerRadius * 1.5);
            ctx.lineTo(enemy.targetX, enemy.targetY + markerRadius * 1.5);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      for (const enemy of triangleEnemies) {
        if (enemy.state === "aiming") {
          ctx.save();
          ctx.strokeStyle = "rgba(77, 166, 255, 0.7)";
          ctx.lineWidth = 2;
          ctx.setLineDash([10, 8]);
          ctx.beginPath();
          ctx.moveTo(enemy.x, enemy.y);
          const trajectoryLength = Math.hypot(canvas.width, canvas.height);
          ctx.lineTo(enemy.x + enemy.dx * trajectoryLength, enemy.y + enemy.dy * trajectoryLength);
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.rotate(Math.atan2(enemy.dy, enemy.dx) + Math.PI / 2);
        ctx.fillStyle = "#4da6ff";
        ctx.beginPath();
        ctx.moveTo(0, -enemy.size);
        ctx.lineTo(enemy.size * 0.85, enemy.size * 0.75);
        ctx.lineTo(-enemy.size * 0.85, enemy.size * 0.75);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      if (triangleBoss) {
        for (const enemy of triangleBoss.members) {
          if (enemy.exited) continue;
          if (bossActionsStarted && enemy.state === "aiming") {
            ctx.save();
            ctx.strokeStyle = "rgba(77, 166, 255, 0.7)";
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 8]);
            ctx.beginPath();
            ctx.moveTo(enemy.x, enemy.y);
            const trajectoryLength = Math.hypot(canvas.width, canvas.height);
            ctx.lineTo(enemy.x + enemy.dx * trajectoryLength, enemy.y + enemy.dy * trajectoryLength);
            ctx.stroke();
            ctx.restore();
          }

          ctx.save();
          ctx.translate(enemy.x, enemy.y);
          ctx.rotate(Math.atan2(enemy.dy, enemy.dx) + Math.PI / 2);
          ctx.fillStyle = "#4da6ff";
          ctx.beginPath();
          ctx.moveTo(0, -enemy.size);
          ctx.lineTo(enemy.size * 0.85, enemy.size * 0.75);
          ctx.lineTo(-enemy.size * 0.85, enemy.size * 0.75);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "#b8dcff";
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.restore();
        }
      }

      if (boss) {
        if (bossActionsStarted && boss.state === "aiming") {
          const progress = 1 - boss.aimTimer / boss.aimDuration;
          const trajectoryLength = Math.hypot(canvas.width, canvas.height);
          ctx.save();
          ctx.strokeStyle = `rgba(255, 55, 65, ${0.2 + progress * 0.65})`;
          ctx.lineWidth = 2 + progress * 22;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(boss.x + boss.size / 2, boss.y + boss.size / 2);
          ctx.lineTo(
            boss.x + boss.size / 2 + boss.dx * trajectoryLength,
            boss.y + boss.size / 2 + boss.dy * trajectoryLength
          );
          ctx.stroke();
          ctx.restore();
        }

        ctx.fillStyle = "#e53935";
        ctx.fillRect(boss.x, boss.y, boss.size, boss.size);
        ctx.strokeStyle = "#ff9a9a";
        ctx.lineWidth = 4;
        ctx.strokeRect(boss.x + 2, boss.y + 2, boss.size - 4, boss.size - 4);
      }

      if (greenBoss) {
        ctx.save();
        ctx.translate(greenBoss.charge.x, greenBoss.charge.y);
        ctx.rotate(greenBoss.charge.angle);
        ctx.fillStyle = "#35c96b";
        ctx.fillRect(
          -GREEN_BOSS_SIZE.width / 2,
          -GREEN_BOSS_SIZE.height / 2,
          GREEN_BOSS_SIZE.width,
          GREEN_BOSS_SIZE.height
        );
        ctx.strokeStyle = "#a6f0bd";
        ctx.lineWidth = 5;
        ctx.strokeRect(
          -GREEN_BOSS_SIZE.width / 2 + 2,
          -GREEN_BOSS_SIZE.height / 2 + 2,
          GREEN_BOSS_SIZE.width - 4,
          GREEN_BOSS_SIZE.height - 4
        );
        ctx.restore();
      }

      // Score
      ctx.fillStyle = "#fff";
      ctx.font = "24px Arial";
      ctx.fillText("Score: " + score, 10, 30);
      ctx.fillText("Lives: " + lives, 10, 60);
      const stageLabel = boss ? "1 Boss" : triangleBoss ? "2 Boss" : greenBoss ? "3 Boss" : purpleBoss ? "4 Boss" : purpleBossDefeated ? "5" : greenBossDefeated ? "4" : triangleBossDefeated ? "3" : bossDefeated ? "2" : "1";
      if (score >= GLITCH_ENEMY_SCORE && stageLabel === "5") {
        const label = "Stage: ";
        const digitX = 10 + ctx.measureText(label).width;
        const digitY = 120;
        const glitchFrame = Math.floor(performance.now() / 70);
        const fragmentColors = ["#fff", "#ff4d4d", "#4da6ff", "#35c96b", "#a64dff", "#ff8e36"];
        ctx.fillText(label, 10, digitY);
        for (let fragment = 0; fragment < 6; fragment++) {
          const fragmentY = digitY - 24 + fragment * 5;
          const shiftX = Math.sin(glitchFrame * 1.7 + fragment * 5) * (fragment % 2 ? 8 : 3);
          const shiftY = Math.sin(glitchFrame * 0.9 + fragment * 3) * 2;
          ctx.save();
          ctx.beginPath();
          ctx.rect(digitX - 10, fragmentY, 38, 5);
          ctx.clip();
          ctx.fillStyle = fragmentColors[(fragment + glitchFrame) % fragmentColors.length];
          ctx.fillText("5", digitX + shiftX, digitY + shiftY);
          ctx.restore();
        }
      } else {
        ctx.fillText("Stage: " + stageLabel, 10, 120);
      }
      if (boss) ctx.fillText("Boss wall hits: " + boss.wallHits + "/" + BOSS_REQUIRED_WALL_HITS, 10, 180);
      if (triangleBoss) {
        ctx.fillText("Boss volleys: " + triangleBoss.completedVolleys + "/" + TRIANGLE_BOSS_VOLLEYS, 10, 180);
      }
      if (greenBoss) {
        ctx.fillText("Boss dodges: " + greenBoss.dodges + "/" + GREEN_BOSS_REQUIRED_DODGES, 10, 180);
      }
      if (purpleBoss) {
        ctx.fillText("Boss wall hits: " + purpleBoss.wallHits + "/" + PURPLE_BOSS_REQUIRED_WALL_HITS, 10, 180);
      }
      if ((boss || triangleBoss || greenBoss || purpleBoss) && !bossActionsStarted) {
        ctx.fillText("Move to begin the boss fight", 10, 210);
      }
      // Game over screen
      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.font = "40px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = "24px Arial";
        ctx.fillText("Press R to return to menu", canvas.width / 2, canvas.height / 2 + 30);
        ctx.textAlign = "left";
      }

      if (performance.now() < hitFlashUntil) {
        ctx.fillStyle = "rgba(255, 0, 0, 0.35)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (paused && !gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.font = "48px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Paused", canvas.width / 2, canvas.height / 2 - 12);
        ctx.font = "24px Arial";
        ctx.fillText("Press Space to resume", canvas.width / 2, canvas.height / 2 + 32);
        ctx.textAlign = "left";
      }
    }

    const GAME_STEP_MS = 1000 / 120;
    const MAX_FRAME_DELTA_MS = 250;
    let previousFrameTime = null;
    let gameTimeAccumulator = 0;

    function gameLoop(timestamp) {
      if (previousFrameTime === null) previousFrameTime = timestamp;
      gameTimeAccumulator += Math.min(timestamp - previousFrameTime, MAX_FRAME_DELTA_MS);
      previousFrameTime = timestamp;

      while (gameTimeAccumulator + 1e-7 >= GAME_STEP_MS) {
        update();
        gameTimeAccumulator -= GAME_STEP_MS;
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
